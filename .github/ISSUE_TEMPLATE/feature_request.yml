name: Feature request
description: Suggest an improvement to Simulator File Importer.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the workflow and any alternatives you considered.
    validations:
      required: true
