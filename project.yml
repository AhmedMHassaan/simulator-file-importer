name: SimulatorPhotos
options:
  deploymentTarget:
    macOS: '13.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '13.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    ARCHS: 'arm64 x86_64'
    ONLY_ACTIVE_ARCH: NO
targets:
  SimulatorPhotos:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources/AppIcon.icns
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Simulator photos importer
        CFBundleName: Simulator photos importer
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: '1.0'
        CFBundleVersion: '1'
        LSMinimumSystemVersion: '13.0'
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: Developed by Ahmed Mohamed Hassaan
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.simulatorphotos.app
        PRODUCT_NAME: Simulator photos importer
        PRODUCT_MODULE_NAME: SimulatorPhotos
        ENABLE_APP_SANDBOX: NO
  SimulatorPhotosTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: SimulatorPhotos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.simulatorphotos.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/Simulator photos importer.app/Contents/MacOS/Simulator photos importer'
        BUNDLE_LOADER: '$(TEST_HOST)'
schemes:
  SimulatorPhotos:
    build:
      targets:
        SimulatorPhotos: all
    test:
      targets: [SimulatorPhotosTests]
